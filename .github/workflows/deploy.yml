name: Build & Refresh Newsflow

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"   # 每小时抓取一次，避开整点拥堵
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsflow-refresh
  cancel-in-progress: true

jobs:
  build-refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache/translations.json
          key: translations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            translations-${{ runner.os }}-

      - name: Fetch primary sources, translate headlines & build data
        run: npm run build

      - name: Validate generated feed
        run: npm test

      - name: Commit refreshed feed for Vercel
        run: |
          if git diff --quiet -- public/data.json; then
            echo "No generated feed changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data.json
          git commit -m "chore: refresh news data [skip ci]"
          git push
